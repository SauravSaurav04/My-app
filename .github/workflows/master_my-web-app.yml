# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - My-web-app

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: build/libs/*.jar

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: ./artifact

      - name: List files in artifact folder
        run: dir artifact

      - name: Get JAR file name
        id: get-jar
        shell: cmd
        run: |
          for %%f in (artifact\*.jar) do (
            echo jar_name=%%f> tmp.txt
            goto :done
          )
          :done
          type tmp.txt >> %GITHUB_OUTPUT%

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ACDA0BD681B74A34ADE709DCFFC05FDE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_62C3925E8FD9418281BC959B141ABE6D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_753EDCFB55F3462EBC29A63BA4119111 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'My-web-app'
          slot-name: 'Production'
          package: ${{ steps.get-jar.outputs.jar_name }}
